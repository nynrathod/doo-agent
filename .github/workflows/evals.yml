name: Agent Evals

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy eval build
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run evals
        run: |
          response=$(curl -s -X POST https://doo-agent.nayanrathod23.workers.dev/agents/run-evals \
            -H "x-eval-token: ${{ secrets.EVAL_TOKEN }}")
          echo "$response"
          passed=$(echo "$response" | jq -r '.passed')
          total=$(echo "$response" | jq -r '.total')
          if [ "$passed" -lt "$((total * 85 / 100))" ]; then
            echo "EVALS FAILED: $passed/$total (threshold 85%)"
            exit 1
          fi
          echo "EVALS PASSED: $passed/$total"